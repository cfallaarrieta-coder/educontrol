<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cambiar contraseña · Colegio Matrícula</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <script src="js/app.js"></script>
</head>

<body>

<div id="navbar"></div>

<main class="contenedor" style="max-width:460px">

    <div class="cabecera">
        <div>
            <h1>Cambiar contraseña</h1>
            <p id="subtitulo">&nbsp;</p>
        </div>
    </div>

    <form class="panel" id="formPassword">

        <label for="passwordActual">Contraseña actual</label>
        <input type="password" id="passwordActual" maxlength="50" autocomplete="current-password" required>

        <label for="passwordNueva" style="margin-top:14px">Nueva contraseña</label>
        <input type="password" id="passwordNueva" minlength="6" maxlength="50" autocomplete="new-password" required>

        <label for="passwordConfirmacion" style="margin-top:14px">Repetir nueva contraseña</label>
        <input type="password" id="passwordConfirmacion" minlength="6" maxlength="50" autocomplete="new-password" required>

        <div style="display:flex;gap:10px;margin-top:18px">
            <button type="submit" id="btnCambiar">Cambiar</button>
            <button type="button" class="btn-gris" onclick="location.href='inicio.html'">Volver</button>
        </div>

    </form>

</main>

<script>

    // =========================================================
    // POST /api/auth/password
    // =========================================================
    $('#formPassword').on('submit', function (evento) {

        evento.preventDefault();

        var nueva = $('#passwordNueva').val();
        var confirmacion = $('#passwordConfirmacion').val();

        // Validación en el navegador. El servidor la repite igualmente:
        // nunca se confía sólo en el frontend.
        if (nueva !== confirmacion) {
            App.toast('La nueva contraseña y su confirmación no coinciden', 'error');
            return;
        }

        var datos = {
            passwordActual: $('#passwordActual').val(),
            passwordNueva: nueva,
            passwordConfirmacion: confirmacion
        };

        $('#btnCambiar').prop('disabled', true).text('Guardando...');

        App.api('POST', '/api/auth/password', datos)
            .done(function (respuesta) {
                App.toast(respuesta.mensaje, 'ok');
                $('#formPassword')[0].reset();

                // El servidor cerró la sesión: hay que entrar con la clave nueva.
                setTimeout(function () { window.location.href = 'login.html'; }, 2500);
            })
            .fail(function (xhr) {
                if (xhr.status !== 401) App.toast(App.mensajeError(xhr), 'error');
                $('#btnCambiar').prop('disabled', false).text('Cambiar');
            });
    });

    App.iniciar().then(function (usuario) {
        $('#subtitulo').text('Usuario: ' + usuario.username);
        $('#passwordActual').focus();
    });

</script>

</body>
</html>
