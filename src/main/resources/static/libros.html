<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de libros</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #eef1f5;
            margin: 0;
            padding: 0 16px 40px;
        }

        header {
            background-color: #007bff;
            color: #fff;
            padding: 14px 20px;
            margin: 0 -16px 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }

        header h1 { font-size: 18px; margin: 0; }
        header .derecha { display: flex; gap: 10px; align-items: center; font-size: 14px; }

        header button {
            background-color: rgba(255, 255, 255, .18);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .5);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        header button:hover { background-color: rgba(255, 255, 255, .3); }

        .contenedor { max-width: 900px; margin: 0 auto; }

        .panel {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 1px 6px rgba(0, 0, 0, .08);
            margin-bottom: 22px;
        }

        h2 { margin: 0 0 16px; font-size: 16px; color: #333; }

        .fila { display: flex; flex-wrap: wrap; gap: 14px; }
        .campo { flex: 1 1 200px; }

        label { display: block; margin-bottom: 5px; font-size: 13px; color: #555; }

        input {
            width: 100%;
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .botones { margin-top: 16px; display: flex; gap: 10px; }

        button {
            padding: 9px 18px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            color: #fff;
            background-color: #007bff;
        }

        button:hover    { background-color: #0056b3; }
        .btn-gris       { background-color: #6c757d; }
        .btn-gris:hover { background-color: #565e64; }

        table { border-collapse: collapse; width: 100%; margin-top: 4px; }

        th, td {
            border-bottom: 1px solid #e3e6ea;
            padding: 10px;
            text-align: left;
            font-size: 14px;
        }

        th { background-color: #f5f7fa; color: #444; font-size: 13px; }
        tbody tr:hover { background-color: #fafbfc; }

        td.acciones { white-space: nowrap; }

        td.acciones button {
            padding: 5px 11px;
            font-size: 12px;
            margin-right: 5px;
        }

        .btn-editar     { background-color: #f0ad4e; }
        .btn-editar:hover { background-color: #d79434; }
        .btn-borrar     { background-color: #dc3545; }
        .btn-borrar:hover { background-color: #b52a37; }

        .vacio { text-align: center; color: #999; padding: 24px; font-size: 14px; }

        #aviso {
            padding: 11px;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }

        .ok    { background-color: #e7f6ec; color: #1b7a3d; }
        .error { background-color: #fdecea; color: #b3261e; }

        .buscador { display: flex; gap: 10px; }
        .buscador input { flex: 1; }
    </style>
</head>

<body>

<header>
    <h1>Registro de libros</h1>
    <div class="derecha">
        <span id="saludo"></span>
        <button type="button" onclick="location.href='perfil.html'">Cambiar contraseña</button>
        <button type="button" id="btnSalir">Salir</button>
    </div>
</header>

<div class="contenedor">

    <div id="aviso"></div>

    <!-- ============ FORMULARIO ============ -->
    <div class="panel">

        <h2 id="tituloFormulario">Nuevo libro</h2>

        <form id="formLibro">

            <!-- Vacío = alta. Con valor = edición. -->
            <input type="hidden" id="libroId">

            <div class="fila">
                <div class="campo">
                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" maxlength="200" required>
                </div>

                <div class="campo">
                    <label for="autor">Autor</label>
                    <input type="text" id="autor" maxlength="150" required>
                </div>

                <div class="campo">
                    <label for="fechaRegistro">Fecha de registro</label>
                    <input type="date" id="fechaRegistro" required>
                </div>
            </div>

            <div class="botones">
                <button type="submit" id="btnGuardar">Guardar</button>
                <button type="button" id="btnCancelar" class="btn-gris" style="display:none">Cancelar</button>
            </div>

        </form>
    </div>

    <!-- ============ LISTADO ============ -->
    <div class="panel">

        <h2>Libros registrados</h2>

        <div class="buscador">
            <input type="text" id="busqueda" placeholder="Buscar por título o autor...">
            <button type="button" id="btnBuscar">Buscar</button>
            <button type="button" id="btnLimpiar" class="btn-gris">Ver todos</button>
        </div>

        <table>
            <thead>
            <tr>
                <th style="width:60px">#</th>
                <th>Título</th>
                <th>Autor</th>
                <th style="width:140px">Fecha registro</th>
                <th style="width:160px">Acciones</th>
            </tr>
            </thead>
            <tbody id="tablaLibros"></tbody>
        </table>

    </div>

</div>

<script>

    // =========================================================
    // Si CUALQUIER petición responde 401, la sesión caducó
    // =========================================================
    $(document).ajaxError(function (evento, xhr) {
        if (xhr.status === 401) {
            window.location.href = 'login.html';
        }
    });

    // =========================================================
    // Evita inyección de HTML al pintar datos en la tabla
    // =========================================================
    function escapar(texto) {
        return $('<div>').text(texto == null ? '' : texto).html();
    }

    // Convierte "2026-03-15" en "15/03/2026"
    function formatearFecha(iso) {
        if (!iso) { return ''; }
        var p = iso.split('-');
        return p[2] + '/' + p[1] + '/' + p[0];
    }

    function avisar(texto, clase) {
        $('#aviso')
            .removeClass()
            .addClass(clase)
            .text(texto)
            .fadeIn()
            .delay(3000)
            .fadeOut();
    }

    function mensajeDeError(xhr) {
        return xhr.responseJSON ? xhr.responseJSON.mensaje : 'Error de conexión con el servidor';
    }

    // =========================================================
    // LISTAR / BUSCAR  ->  GET /api/libros?q=
    // =========================================================
    function listarLibros(texto) {

        $.ajax({
            url: '/api/libros',
            type: 'GET',
            data: { q: texto || '' },

            success: function (libros) {

                var cuerpo = $('#tablaLibros').empty();

                if (libros.length === 0) {
                    cuerpo.append(
                        '<tr><td colspan="5" class="vacio">No hay libros registrados</td></tr>');
                    return;
                }

                $.each(libros, function (indice, libro) {
                    cuerpo.append(
                        '<tr>' +
                        '<td>' + libro.id + '</td>' +
                        '<td>' + escapar(libro.titulo) + '</td>' +
                        '<td>' + escapar(libro.autor) + '</td>' +
                        '<td>' + formatearFecha(libro.fechaRegistro) + '</td>' +
                        '<td class="acciones">' +
                        '<button class="btn-editar" onclick="editarLibro(' + libro.id + ')">Editar</button>' +
                        '<button class="btn-borrar" onclick="eliminarLibro(' + libro.id + ')">Eliminar</button>' +
                        '</td>' +
                        '</tr>');
                });
            }
        });
    }

    // =========================================================
    // GUARDAR  ->  POST (nuevo) o PUT (edición)
    // =========================================================
    $('#formLibro').on('submit', function (evento) {

        evento.preventDefault();

        var id = $('#libroId').val();

        var libro = {
            titulo: $('#titulo').val().trim(),
            autor: $('#autor').val().trim(),
            fechaRegistro: $('#fechaRegistro').val()
        };

        $.ajax({
            url: id ? '/api/libros/' + id : '/api/libros',
            type: id ? 'PUT' : 'POST',
            contentType: 'application/json',
            data: JSON.stringify(libro),

            success: function () {
                avisar(id ? 'Libro actualizado' : 'Libro registrado', 'ok');
                limpiarFormulario();
                listarLibros($('#busqueda').val());
            },

            error: function (xhr) {
                if (xhr.status !== 401) {
                    avisar(mensajeDeError(xhr), 'error');
                }
            }
        });
    });

    // =========================================================
    // EDITAR  ->  GET /api/libros/{id} y rellenar el formulario
    // =========================================================
    function editarLibro(id) {

        $.ajax({
            url: '/api/libros/' + id,
            type: 'GET',

            success: function (libro) {

                $('#libroId').val(libro.id);
                $('#titulo').val(libro.titulo);
                $('#autor').val(libro.autor);
                $('#fechaRegistro').val(libro.fechaRegistro);

                $('#tituloFormulario').text('Editando libro #' + libro.id);
                $('#btnGuardar').text('Actualizar');
                $('#btnCancelar').show();

                $('html, body').animate({ scrollTop: 0 }, 200);
                $('#titulo').focus();
            }
        });
    }

    // =========================================================
    // ELIMINAR  ->  DELETE /api/libros/{id}
    // =========================================================
    function eliminarLibro(id) {

        if (!confirm('¿Seguro que deseas eliminar este libro?')) {
            return;
        }

        $.ajax({
            url: '/api/libros/' + id,
            type: 'DELETE',

            success: function (respuesta) {
                avisar(respuesta.mensaje, 'ok');

                // Si estabas editando justo ese libro, limpia el formulario.
                if ($('#libroId').val() == id) {
                    limpiarFormulario();
                }

                listarLibros($('#busqueda').val());
            },

            error: function (xhr) {
                if (xhr.status !== 401) {
                    avisar(mensajeDeError(xhr), 'error');
                }
            }
        });
    }

    // =========================================================
    // Utilidades del formulario
    // =========================================================
    function limpiarFormulario() {
        $('#formLibro')[0].reset();
        $('#libroId').val('');
        $('#tituloFormulario').text('Nuevo libro');
        $('#btnGuardar').text('Guardar');
        $('#btnCancelar').hide();
        ponerFechaDeHoy();
    }

    function ponerFechaDeHoy() {
        var hoy = new Date();
        var mes = String(hoy.getMonth() + 1).padStart(2, '0');
        var dia = String(hoy.getDate()).padStart(2, '0');
        var iso = hoy.getFullYear() + '-' + mes + '-' + dia;

        $('#fechaRegistro').val(iso);
        // El backend rechaza fechas futuras (@PastOrPresent)
        $('#fechaRegistro').attr('max', iso);
    }

    $('#btnCancelar').on('click', limpiarFormulario);

    $('#btnBuscar').on('click', function () {
        listarLibros($('#busqueda').val());
    });

    $('#busqueda').on('keypress', function (evento) {
        if (evento.which === 13) {
            listarLibros($('#busqueda').val());
        }
    });

    $('#btnLimpiar').on('click', function () {
        $('#busqueda').val('');
        listarLibros('');
    });

    // =========================================================
    // SALIR  ->  POST /api/auth/logout
    // =========================================================
    $('#btnSalir').on('click', function () {
        $.ajax({
            url: '/api/auth/logout',
            type: 'POST',
            complete: function () {
                window.location.href = 'login.html';
            }
        });
    });

    // =========================================================
    // ARRANQUE: comprobar sesión y luego cargar los datos
    // =========================================================
    $.ajax({
        url: '/api/auth/sesion',
        type: 'GET',

        success: function (usuario) {
            $('#saludo').text('Hola, ' + usuario.username);
            ponerFechaDeHoy();
            listarLibros('');
        }
        // Si responde 401, el ajaxError global redirige al login.
    });

</script>

</body>
</html>
