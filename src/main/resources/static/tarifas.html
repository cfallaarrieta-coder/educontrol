<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tarifas · Colegio Matrícula</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <script src="js/app.js"></script>
</head>
<body>

<div id="navbar"></div>

<main class="contenedor">
    <div class="cabecera">
        <div>
            <h1>Gestión de Tarifas</h1>
            <p>Configura los costos de matrícula y mensualidad por Año Escolar y Nivel.</p>
        </div>
    </div>

    <div class="panel">
        <div class="barra-herramientas">
            <div class="campo ancho">
                <label for="cboAnio">Año Escolar:</label>
                <select id="cboAnio"></select>
            </div>
            <div style="flex: 1; text-align: right;">
                <button type="button" id="btnCopiar" class="btn btn-naranja" style="margin-bottom: 2px;">Copiar de otro año...</button>
            </div>
        </div>

        <div class="tabla-scroll">
            <table id="tablaTarifas">
                <thead>
                <tr>
                    <th>Nivel</th>
                    <th>Derecho Matrícula</th>
                    <th>Mensualidad (10 cuotas)</th>
                    <th class="acciones">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <!-- JS -->
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- Modal Editar Tarifa -->
<div id="modalTarifa" class="modal-fondo" hidden>
    <div class="modal" style="max-width: 450px;">
        <h2>Editar Tarifa</h2>
        <form id="frmTarifa">
            <input type="hidden" id="txtNivel">
            
            <div class="fila" style="margin-bottom: 12px;">
                <div class="campo">
                    <label>Nivel:</label>
                    <input type="text" id="txtNivelLabel" readonly style="background:#f5f5f5;">
                </div>
            </div>
            <div class="fila" style="margin-bottom: 12px;">
                <div class="campo">
                    <label for="txtMatricula">Derecho de Matrícula (S/):</label>
                    <input type="number" id="txtMatricula" step="0.01" min="0" required>
                </div>
            </div>
            <div class="fila">
                <div class="campo">
                    <label for="txtMensualidad">Mensualidad (S/):</label>
                    <input type="number" id="txtMensualidad" step="0.01" min="0" required>
                </div>
            </div>
            
            <div class="botones">
                <button type="button" class="btn btn-gris" onclick="$('#modalTarifa').prop('hidden', true)">Cancelar</button>
                <button type="submit" class="btn btn-azul">Guardar Tarifa</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Copiar Tarifas -->
<div id="modalCopiar" class="modal-fondo" hidden>
    <div class="modal" style="max-width: 400px;">
        <h2>Copiar Tarifas</h2>
        <p style="margin-top: 0;">Se copiarán las tarifas hacia el año <b id="lblAnioDestino"></b>.</p>
        
        <div class="fila">
            <div class="campo">
                <label for="cboAnioOrigen">Copiar desde el año:</label>
                <select id="cboAnioOrigen"></select>
            </div>
        </div>

        <div class="botones">
            <button type="button" class="btn btn-gris" onclick="$('#modalCopiar').prop('hidden', true)">Cancelar</button>
            <button type="button" id="btnConfirmarCopia" class="btn btn-verde">Copiar</button>
        </div>
    </div>
</div>

<script>
    var anios = [];
    var niveles = ['INICIAL', 'PRIMARIA', 'SECUNDARIA'];

    App.iniciar({ soloAdmin: true }).then(function () {
        // Cargar combos de años
        App.api('GET', '/api/anios').done(function(res) {
            anios = res;
            var cbo = $('#cboAnio');
            var cboOrigen = $('#cboAnioOrigen');
            $.each(res, function(i, a) {
                cbo.append(new Option(a.anio, a.id));
                cboOrigen.append(new Option(a.anio, a.id));
            });
            if (res.length > 0) {
                cargarTarifas();
            }
        });

        $('#cboAnio').change(cargarTarifas);

        $('#frmTarifa').submit(function(e) {
            e.preventDefault();
            var anioId = $('#cboAnio').val();
            var nivel = $('#txtNivel').val();
            var req = {
                montoMatricula: $('#txtMatricula').val(),
                montoMensualidad: $('#txtMensualidad').val()
            };
            var btn = $(this).find('button[type="submit"]');
            
            App.api('PUT', '/api/tarifas/' + anioId + '/' + nivel, req, btn)
                .done(function() {
                    $('#modalTarifa').prop('hidden', true);
                    App.toast('Tarifa guardada correctamente', 'ok');
                    cargarTarifas();
                });
        });

        $('#btnCopiar').click(function() {
            $('#lblAnioDestino').text($('#cboAnio option:selected').text());
            $('#modalCopiar').prop('hidden', false);
        });

        $('#btnConfirmarCopia').click(function() {
            var destinoId = $('#cboAnio').val();
            var origenId = $('#cboAnioOrigen').val();
            if (destinoId === origenId) {
                App.toast('Seleccione un año de origen distinto al destino.', 'error');
                return;
            }
            var btn = $(this);
            App.api('POST', '/api/tarifas/copiar?origenId=' + origenId + '&destinoId=' + destinoId, null, btn)
                .done(function() {
                    $('#modalCopiar').prop('hidden', true);
                    App.toast('Tarifas copiadas correctamente', 'ok');
                    cargarTarifas();
                });
        });
    });

    function cargarTarifas() {
        var anioId = $('#cboAnio').val();
        if (!anioId) return;

        App.api('GET', '/api/tarifas?anioId=' + anioId).done(function(res) {
            var tbody = $('#tablaTarifas tbody').empty();
            
            $.each(niveles, function(i, niv) {
                var t = res.find(function(x) { return x.nivel === niv; });
                var matriculaTxt = t ? 'S/ ' + Number(t.montoMatricula).toFixed(2) : '<span style="color:#999">No config.</span>';
                var mensualidadTxt = t ? 'S/ ' + Number(t.montoMensualidad).toFixed(2) : '<span style="color:#999">No config.</span>';
                
                var btnEditar = '<button type="button" class="btn btn-chico" onclick="abrirEdicion(\'' + niv + '\', ' + (t ? t.montoMatricula : 'null') + ', ' + (t ? t.montoMensualidad : 'null') + ')">Editar</button>';
                var btnAplicar = t ? '<button type="button" class="btn btn-verde btn-chico" onclick="aplicarMasivo(\'' + niv + '\', ' + t.montoMensualidad + ')">Aplicar a Deudas</button>' : '';

                tbody.append('<tr>' +
                    '<td><span class="etiqueta et-azul">' + App.nombre(niv) + '</span></td>' +
                    '<td>' + matriculaTxt + '</td>' +
                    '<td>' + mensualidadTxt + '</td>' +
                    '<td class="acciones">' + btnEditar + btnAplicar + '</td>' +
                '</tr>');
            });
        });
    }

    window.abrirEdicion = function(nivel, mat, men) {
        $('#txtNivel').val(nivel);
        $('#txtNivelLabel').val(App.nombre(nivel));
        $('#txtMatricula').val(mat || '');
        $('#txtMensualidad').val(men || '');
        $('#modalTarifa').prop('hidden', false);
    };

    window.aplicarMasivo = function(nivel, monto) {
        if (!confirm('¿Aplicar el nuevo monto (S/ ' + Number(monto).toFixed(2) + ') a todas las cuotas PENDIENTES de ' + App.nombre(nivel) + ' de este año?\n\nLos meses ya pagados no se alteran.')) return;
        var anioId = $('#cboAnio').val();
        App.api('POST', '/api/tarifas/' + anioId + '/' + nivel + '/aplicar')
           .done(function(res) {
               App.toast(res.mensaje || 'Cuotas actualizadas correctamente', 'ok');
           });
    };
</script>
</body>
</html>
