<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #eef1f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }

        .caja {
            background-color: #fff;
            width: 100%;
            max-width: 380px;
            padding: 32px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .12);
        }

        h2 { margin: 0 0 6px; text-align: center; color: #333; font-size: 19px; }

        .subtitulo {
            margin: 0 0 24px;
            text-align: center;
            font-size: 13px;
            color: #888;
        }

        label { display: block; margin-bottom: 6px; font-size: 13px; color: #555; }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .pista {
            margin: -12px 0 16px;
            font-size: 11px;
            color: #999;
        }

        button {
            width: 100%;
            padding: 11px;
            background-color: #28a745;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover    { background-color: #1e7e34; }
        button:disabled { background-color: #9ad0a7; cursor: default; }

        #mensaje {
            margin-top: 16px;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .ok    { background-color: #e7f6ec; color: #1b7a3d; }
        .error { background-color: #fdecea; color: #b3261e; }

        .pie {
            margin-top: 22px;
            font-size: 13px;
            color: #666;
            text-align: center;
        }

        .pie a { color: #007bff; text-decoration: none; }
        .pie a:hover { text-decoration: underline; }
    </style>
</head>

<body>

<div class="caja">

    <h2>Crear cuenta</h2>
    <p class="subtitulo">Registrate para acceder al sistema</p>

    <form id="formRegistro">

        <label for="username">Usuario</label>
        <input type="text" id="username" minlength="4" maxlength="50"
               autocomplete="username" required>
        <p class="pista">Entre 4 y 50 caracteres. Solo letras, numeros y guion bajo.</p>

        <label for="password">Contraseña</label>
        <input type="password" id="password" minlength="6" maxlength="50"
               autocomplete="new-password" required>
        <p class="pista">Minimo 6 caracteres.</p>

        <label for="passwordConfirmacion">Repetir contraseña</label>
        <input type="password" id="passwordConfirmacion" minlength="6" maxlength="50"
               autocomplete="new-password" required>

        <button type="submit" id="btnRegistrar">Crear cuenta</button>

    </form>

    <div id="mensaje"></div>

    <p class="pie">¿Ya tienes cuenta? <a href="login.html">Inicia sesion</a></p>

</div>

<script>

    function avisar(texto, clase) {
        $('#mensaje').removeClass().addClass(clase).text(texto).fadeIn();
    }

    // =========================================================
    // POST /api/auth/registro
    // =========================================================
    $('#formRegistro').on('submit', function (evento) {

        evento.preventDefault();

        var password = $('#password').val();
        var confirmacion = $('#passwordConfirmacion').val();

        // Comprobacion rapida en el navegador.
        // El servidor la repite igualmente: nunca se confia solo en el frontend.
        if (password !== confirmacion) {
            avisar('La contraseña y su confirmacion no coinciden', 'error');
            return;
        }

        var datos = {
            username: $('#username').val().trim(),
            password: password,
            passwordConfirmacion: confirmacion
        };

        $('#btnRegistrar').prop('disabled', true).text('Creando...');

        $.ajax({
            url: '/api/auth/registro',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(datos),

            success: function (usuario) {

                avisar('Cuenta creada. Redirigiendo al login...', 'ok');
                $('#formRegistro')[0].reset();
                $('#btnRegistrar').hide();

                setTimeout(function () {
                    window.location.href = 'login.html';
                }, 2000);
            },

            error: function (xhr) {
                avisar(xhr.responseJSON
                    ? xhr.responseJSON.mensaje
                    : 'No se pudo conectar con el servidor', 'error');

                $('#btnRegistrar').prop('disabled', false).text('Crear cuenta');
            }
        });
    });

    $('#username').focus();

</script>

</body>
</html>
