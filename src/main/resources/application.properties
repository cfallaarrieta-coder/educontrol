spring.application.name=demo
# En Railway el puerto llega en la variable PORT
server.port=${PORT:8080}

# Credenciales locales (no se suben a GitHub)
spring.config.import=optional:classpath:application-local.properties

# ==========================================
# Conexión a MySQL
# ==========================================
# Se leen de variables de entorno (configuradas en Railway)
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate
# ==========================================
# update = Hibernate crea las tablas usuario y libro si no existen
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ==========================================
# Sesión
# ==========================================
server.servlet.session.timeout=30m