spring.application.name=demo
# En Railway el puerto llega en la variable PORT
server.port=${PORT:8080}

# Detras del proxy de Railway (https): respeta X-Forwarded-Proto/Host.
# Necesario para que el handshake del WebSocket pase la validacion de origen.
server.forward-headers-strategy=framework

# Credenciales locales (no se suben a GitHub)
spring.config.import=optional:classpath:application-local.properties

# ==========================================
# Conexión a MySQL
# ==========================================
# Se leen de variables de entorno (configuradas en Railway)
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tiempo maximo de espera (segundos) para transacciones concurrentes en MySQL
spring.datasource.hikari.connection-init-sql=SET SESSION innodb_lock_wait_timeout = 10

# ==========================================
# Conexión a Redis (REDIS_SPEC.md - Secciones 3 y 4)
# ==========================================
# 1. URL del Redis Maestro (en Railway: REDIS_URL=${{Redis-Master.REDIS_URL}})
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
spring.data.redis.repositories.enabled=false

# 2. Arquitectura Opción 2: Redis Master-Replica (1 Master + 2 Réplicas) con 3 Sentinels
# En Railway, al definir REDIS_SENTINEL_NODES se activa automáticamente la topología
# Sentinel + Lectura desde Réplicas (ReadFrom.REPLICA_PREFERRED):
#   REDIS_SENTINEL_MASTER=educontrol-master
#   REDIS_SENTINEL_NODES=${{Sentinel-1.RAILWAY_PRIVATE_DOMAIN}}:26379,${{Sentinel-2.RAILWAY_PRIVATE_DOMAIN}}:26379,${{Sentinel-3.RAILWAY_PRIVATE_DOMAIN}}:26379
#   REDIS_PASSWORD=${{Redis-Master.REDISPASSWORD}}
spring.data.redis.sentinel.master=${REDIS_SENTINEL_MASTER:educontrol-master}
spring.data.redis.sentinel.nodes=${REDIS_SENTINEL_NODES:}
spring.data.redis.sentinel.password=${REDIS_SENTINEL_PASSWORD:}

# Alternativa sin Sentinels (Maestro + Réplicas estáticas separadas por coma):
app.redis.replica-urls=${REDIS_REPLICA_URLS:}

# Activa la conexión al servidor Redis externo (true en producción/Railway)
app.redis.external-enabled=${REDIS_ENABLED:true}

# ==========================================
# JPA / Hibernate
# ==========================================
# update = Hibernate crea/actualiza las tablas si no existen
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ==========================================
# Sesión
# ==========================================
server.servlet.session.timeout=30m
# La cookie de sesion no viaja en peticiones de otros sitios (protege el WebSocket y la API)
server.servlet.session.cookie.same-site=lax

# ==========================================
# WebSocket
# ==========================================
# Dominios permitidos para conectarse a /ws (separados por coma).
# Si usas un dominio propio, agregalo con la variable WS_ORIGENES en Railway.
app.websocket.origenes=${WS_ORIGENES:https://*.up.railway.app,http://localhost:[*],http://127.0.0.1:[*]}

# ==========================================
# Demo del bloqueo pesimista
# ==========================================
# Milisegundos que la matricula "retiene" el bloqueo. Para la exposicion
# usa 5000 y matricula desde dos navegadores a la vez. Normal: 0.
app.demo.retardo-matricula-ms=${RETARDO_DEMO_MS:0}
