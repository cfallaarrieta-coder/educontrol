spring.application.name=demo
# En Railway el puerto llega en la variable PORT
server.port=${PORT:8080}

# Detras del proxy de Railway (https): respeta X-Forwarded-Proto/Host.
# Necesario para que el handshake del WebSocket pase la validacion de origen.
server.forward-headers-strategy=framework

# Credenciales locales (no se suben a GitHub)
spring.config.import=optional:classpath:application-local.properties

# ==========================================
# Conexión a MySQL
# ==========================================
# Se leen de variables de entorno (configuradas en Railway)
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tiempo maximo de espera (segundos) para transacciones concurrentes en MySQL
spring.datasource.hikari.connection-init-sql=SET SESSION innodb_lock_wait_timeout = 10

# ==========================================
# Conexión a Redis (REDIS_SPEC.md)
# ==========================================
# En Railway basta con vincular la variable REDIS_URL=${{Redis.REDIS_URL}}
# Si no está definida, intenta conectar en localhost:6379 (y si no hay Redis local,
# degrada automáticamente a la pizarra en memoria sin detener el sistema).
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
spring.data.redis.repositories.enabled=false

# Soporte opcional para Redis Master-Replica con Sentinel (Sección 4 de REDIS_SPEC.md):
# Si se despliega con Sentinel, definir las variables de entorno:
# SPRING_DATA_REDIS_SENTINEL_MASTER=educontrol-master
# SPRING_DATA_REDIS_SENTINEL_NODES=host1:26379,host2:26379,host3:26379

# Activa la conexión al servidor Redis externo (true en producción/Railway)
app.redis.external-enabled=${REDIS_ENABLED:true}

# ==========================================
# JPA / Hibernate
# ==========================================
# update = Hibernate crea/actualiza las tablas si no existen
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ==========================================
# Sesión
# ==========================================
server.servlet.session.timeout=30m
# La cookie de sesion no viaja en peticiones de otros sitios (protege el WebSocket y la API)
server.servlet.session.cookie.same-site=lax

# ==========================================
# WebSocket
# ==========================================
# Dominios permitidos para conectarse a /ws (separados por coma).
# Si usas un dominio propio, agregalo con la variable WS_ORIGENES en Railway.
app.websocket.origenes=${WS_ORIGENES:https://*.up.railway.app,http://localhost:[*],http://127.0.0.1:[*]}

# ==========================================
# Demo del bloqueo pesimista
# ==========================================
# Milisegundos que la matricula "retiene" el bloqueo. Para la exposicion
# usa 5000 y matricula desde dos navegadores a la vez. Normal: 0.
app.demo.retardo-matricula-ms=${RETARDO_DEMO_MS:0}
