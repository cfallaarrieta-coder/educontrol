spring.application.name=demo
# En Railway el puerto llega en la variable PORT; en local usa application-local.properties
server.port=${PORT:8080}

# Credenciales locales (no se suben a GitHub)
spring.config.import=optional:classpath:application-local.properties

# ==========================================
# Conexión a SQL Server
# ==========================================
# Se leen de variables de entorno (configuradas en Railway)
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==========================================
# JPA / Hibernate
# ==========================================
# none = Hibernate NO toca la estructura de la BD.
# Las tablas ya las creaste tú con el script del paso 1.
spring.jpa.hibernate.ddl-auto=none

# Muestra en consola el SQL que ejecuta Hibernate (útil para aprender)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ==========================================
# Sesión (el login la usa para recordarte)
# ==========================================
server.servlet.session.timeout=30m

logging.level.org.springframework.web.servlet.mvc.method.annotation=TRACE