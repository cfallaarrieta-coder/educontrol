# Configuracion SOLO para los tests: base de datos H2 en memoria (no toca MySQL).
spring.datasource.url=jdbc:h2:mem:colegio;MODE=MySQL;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=20

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

app.demo.retardo-matricula-ms=0

app.websocket.origenes=http://localhost:[*]
