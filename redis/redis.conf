# =====================================================================
# Configuración de Redis para EduControl (Sección 3 de REDIS_SPEC.md)
# Mecanismo de Persistencia Híbrida: RDB (Fotos) + AOF (Bitácora cada 1s)
# =====================================================================

# 1. RDB (Fotografías periódicas en disco)
# Guarda una foto si hay al menos:
# - 1 cambio en 15 minutos (900 seg)
# - 10 cambios en 5 minutos (300 seg)
# - 10000 cambios en 1 minuto (60 seg)
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb

# 2. AOF (Diario paso a paso cada segundo)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 3. Persistencia Híbrida (RDB + AOF combinados)
# Al reescribir el AOF, incluye un preámbulo RDB compacto al inicio y luego
# los comandos AOF recientes. Garantiza arranque ultrarrápido y máxima seguridad.
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 4. Gestión de memoria para llaves con TTL (Sesiones, Caché y Candados)
maxmemory-policy volatile-lru
